name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @animbrio/schema test
      - run: pnpm --filter @animbrio/schema build
      - run: pnpm --filter @animbrio/animation-engine test
      - run: pnpm --filter @animbrio/animation-engine build
      - run: pnpm --filter @animbrio/interaction-engine test
      - run: pnpm --filter @animbrio/interaction-engine build
      - run: pnpm --filter @animbrio/persistence build
      - run: pnpm --filter @animbrio/editor-core test
      - run: pnpm --filter @animbrio/editor-core build
      - run: pnpm --filter @animbrio/renderer build
      - run: pnpm --filter @animbrio/editor build
      - run: pnpm --filter @animbrio/integration-demo build
