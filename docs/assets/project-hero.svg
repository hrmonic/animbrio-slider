<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc"><title id="title">Animbrio Slider — Motion design editor and React player</title><desc id="desc">Original editorial banner featuring a visual scene editor, reusable animation engine and React integration.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1525"/><stop offset="1" stop-color="#121D30"/></linearGradient><linearGradient id="type" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F4A4CA"/><stop offset="1" stop-color="#86B1FF"/></linearGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#9CAEC1" opacity=".11"/></pattern></defs><rect width="1280" height="420" rx="20" fill="url(#bg)"/><rect width="1280" height="420" rx="20" fill="url(#grid)"/><circle cx="1060" cy="-30" r="260" fill="#F4A4CA" opacity=".06"/><circle cx="850" cy="400" r="220" fill="#86B1FF" opacity=".05"/><rect x="65" y="54" width="230" height="32" rx="16" fill="#F4A4CA" fill-opacity=".12" stroke="#F4A4CA" stroke-opacity=".5"/><circle cx="85" cy="70" r="4" fill="#F4A4CA"/><text x="99" y="74" fill="#F4A4CA" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">VISUAL CREATION SYSTEM</text><text x="65" y="169" fill="#F9FAFD" font-family="Segoe UI,Arial,sans-serif" font-size="67" font-weight="750">Animbrio</text><text x="65" y="239" fill="url(#type)" font-family="Segoe UI,Arial,sans-serif" font-size="76" font-weight="750">Slider.</text><text x="67" y="292" fill="#CDD9E9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Design motion. Publish experiences.</text><text x="67" y="323" fill="#CDD9E9" font-family="Segoe UI,Arial,sans-serif" font-size="20">Embed animated scenes in your app.</text><text x="67" y="371" fill="#8EA1BA" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.7">NEXT.JS  /  REACT  /  ANIMATION</text><path d="M702 107V327" stroke="#F4A4CA" opacity=".55" stroke-dasharray="5 7" stroke-width="2"/><circle cx="702" cy="107" r="5" fill="#F4A4CA"/><circle cx="702" cy="217" r="5" fill="#86B1FF"/><circle cx="702" cy="327" r="5" fill="#7CE0CB"/><rect x="731" y="53" width="480" height="98" rx="16" fill="#192438" stroke="#40536A"/><rect x="751" y="70" width="5" height="64" rx="2.5" fill="#F4A4CA"/><text x="779" y="95" fill="#F5F8FD" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Visual scene editor</text><text x="779" y="123" fill="#A9B8CC" font-family="Segoe UI,Arial,sans-serif" font-size="15">Canvas, layers and timeline</text><circle cx="1174" cy="102" r="16" fill="#F4A4CA" fill-opacity=".15"/><circle cx="1174" cy="102" r="6" fill="#F4A4CA"/><rect x="731" y="163" width="480" height="98" rx="16" fill="#192438" stroke="#40536A"/><rect x="751" y="180" width="5" height="64" rx="2.5" fill="#86B1FF"/><text x="779" y="205" fill="#F5F8FD" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Reusable motion engine</text><text x="779" y="233" fill="#A9B8CC" font-family="Segoe UI,Arial,sans-serif" font-size="15">Deterministic keyframe evaluation</text><circle cx="1174" cy="212" r="16" fill="#86B1FF" fill-opacity=".15"/><circle cx="1174" cy="212" r="6" fill="#86B1FF"/><rect x="731" y="273" width="480" height="98" rx="16" fill="#192438" stroke="#40536A"/><rect x="751" y="290" width="5" height="64" rx="2.5" fill="#7CE0CB"/><text x="779" y="315" fill="#F5F8FD" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">React integration</text><text x="779" y="343" fill="#A9B8CC" font-family="Segoe UI,Arial,sans-serif" font-size="15">Embeddable modules and public API</text><circle cx="1174" cy="322" r="16" fill="#7CE0CB" fill-opacity=".15"/><circle cx="1174" cy="322" r="6" fill="#7CE0CB"/></svg>